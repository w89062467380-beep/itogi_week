<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Установочная сессия — анкета</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#263326;background:#f5f5ef}*{box-sizing:border-box}body{margin:0}header{background:#344b35;color:white;padding:22px max(22px,calc((100vw - 950px)/2));display:flex;justify-content:space-between;gap:16px;align-items:center}header strong{font-size:22px}main{max-width:950px;margin:34px auto;padding:0 18px}.panel{background:white;border:1px solid #e2e6d9;border-radius:18px;padding:30px;box-shadow:0 8px 30px #273c2410}.muted{color:#677365}.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#697a5d}h1{font-size:clamp(25px,4vw,36px);line-height:1.18;margin:10px 0 16px}h2{font-size:23px}p{line-height:1.6}button{border:0;background:#526a48;color:white;border-radius:10px;padding:13px 20px;font:inherit;font-weight:600;cursor:pointer}button.secondary{background:#e9eee3;color:#30442d}button.ghost{background:transparent;color:inherit;border:1px solid #a5b09d}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.progress{height:8px;background:#e8ebdf;border-radius:10px;overflow:hidden;margin:24px 0}.progress span{display:block;height:100%;background:#7d956c;transition:width .2s}textarea,input,select{font:inherit;width:100%;border:1px solid #c9d2c2;border-radius:10px;padding:14px;color:#253326;background:#fff}textarea{min-height:190px;resize:vertical;line-height:1.6}label{display:block;margin:14px 0 7px;font-weight:600}.item{padding:20px 0;border-bottom:1px solid #e5e8df}.item:last-child{border:0}.answer{white-space:pre-wrap;background:#f4f6f0;border-radius:10px;padding:15px;margin-top:10px;line-height:1.6}.tag{font-size:12px;font-weight:700;color:#536a48;background:#e7eee1;padding:6px 10px;border-radius:20px;display:inline-block}.notice{border-left:4px solid #8da17c;padding:12px 16px;background:#f1f4ec;margin:20px 0}.topbuttons{display:flex;gap:8px;flex-wrap:wrap}small{color:#6b7767}.hidden{display:none}@media(max-width:600px){header{display:block}.topbuttons{margin-top:15px}.panel{padding:20px}}</style></head><body><header><strong>Установочная сессия</strong><div class="topbuttons"><button class="ghost" id="clientTab">Анкета клиента</button><button class="ghost" id="coachTab">Просмотр коуча · демо</button></div></header><main id="root"></main><script>
const Q=['Возраст','Семейное положение','Профессиональный путь / образование','Опыт общения с психологами, коучами или другими специалистами помогающих профессий','Увлечения / хобби','Опишите свой образ жизни и свою ситуацию','Какие вопросы вы планируете обсудить? Над какими вопросами поработать? Что беспокоит? Что заставляет думать о чём-то?','Какой результат (образ) вы хотите получить?','Зачем вам это нужно (получение результата)?','Почему вы начинаете работу именно сейчас?'];
const key='coaching_intake_demo_v1';let state=JSON.parse(localStorage.getItem(key)||'null')||{answers:Array(10).fill(''),name:'',submitted:false};let step=0,view='client';const root=document.getElementById('root');function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){if(view==='coach')return coach();if(state.submitted)return root.innerHTML=`<section class="panel"><div class="eyebrow">Анкета отправлена</div><h1>Спасибо за ваши ответы</h1><p>Ваши ответы сохранены в этом браузере для демонстрации. Никаких оценок или результатов анкета не формирует.</p><div class="actions"><button class="secondary" onclick="state.submitted=false;step=0;save();render()">Изменить ответы</button></div></section>`;root.innerHTML=`<section class="panel"><div class="eyebrow">Предварительное знакомство · вопрос ${step+1} из ${Q.length}</div><h1>${esc(Q[step])}</h1><p class="muted">Отвечайте так, как вам удобно. Здесь нет правильных или неправильных ответов.</p><div class="progress"><span style="width:${(step+1)/Q.length*100}%"></span></div>${step===0?`<label for="name">Как к вам обращаться? (необязательно)</label><input id="name" value="${esc(state.name)}" placeholder="Имя" autocomplete="off">`:''}${step===0?`<label for="answer">Возраст (полных лет)</label><input id="answer" type="number" min="1" max="120" step="1" inputmode="numeric" placeholder="Укажите возраст" value="${esc(state.answers[step])}">`:step===1?`<label for="answer">Выберите один вариант</label><select id="answer"><option value="">Выберите семейное положение</option>${['Замужем','Женат','Не замужем','Не женат'].map(v=>`<option value="${v}" ${state.answers[step]===v?'selected':''}>${v}</option>`).join('')}</select>`:`<label for="answer">Ваш ответ</label><textarea id="answer" placeholder="Напишите свой ответ здесь…">${esc(state.answers[step])}</textarea>`}<div class="actions"><button class="secondary" onclick="move(-1)" ${step===0?'disabled':''}>Назад</button><button onclick="move(1)">${step===9?'Завершить анкету':'Следующий вопрос'}</button><button class="ghost" onclick="saveStep();alert('Черновик сохранён в этом браузере')">Сохранить черновик</button></div><p><small>Демо: ответы остаются только в этом браузере. Они не отправляются коучу через интернет.</small></p></section>`}function saveStep(){state.answers[step]=document.getElementById('answer').value;if(step===0)state.name=document.getElementById('name').value;save()}function move(n){if(n===1&&step===0){let v=document.getElementById('answer').value;if(v!==''&&(!Number.isInteger(Number(v))||Number(v)<1||Number(v)>120)){alert('Укажите возраст целым числом от 1 до 120 или оставьте поле пустым');return}}saveStep();if(n===1&&step===9){state.submitted=true;save();render();return}step=Math.max(0,Math.min(9,step+n));render()}
function coach(){root.innerHTML=`<section class="panel"><div class="eyebrow">Рабочий кабинет · демонстрация</div><h1>Карточка клиента</h1><div class="notice">Это локальный прототип. Переключение в режим коуча не защищено паролем. Для реальных клиентов необходимы отдельный защищённый кабинет, согласие на обработку данных и безопасное хранение.</div><p><b>Имя:</b> ${esc(state.name)||'Не указано'}<br><b>Статус:</b> ${state.submitted?'Анкета завершена':'Черновик'}<br><b>Заполнено:</b> ${state.answers.filter(x=>x.trim()).length} из 10</p><div class="actions"><button onclick="exportData()">Скачать ответы · JSON</button><button class="secondary" onclick="exportText()">Скачать карточку · TXT</button><button class="secondary" onclick="document.getElementById('upload').click()">Загрузить ответы · JSON</button><input type="file" id="upload" accept="application/json,.json" style="display:none" onchange="importData(this)"></div><h2>Ответы клиента</h2>${Q.map((q,i)=>`<div class="item"><span class="tag">Вопрос ${i+1}</span><h3>${esc(q)}</h3><div class="answer">${esc(state.answers[i])||'<span class="muted">Ответ не предоставлен</span>'}</div></div>`).join('')}<h2>Сопоставление ответов</h2><p class="muted">Автоматические психологические выводы не формируются. Для сопоставления выберите два вопроса: система покажет точные ответы рядом, без трактовок.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px"><div><label>Первый вопрос</label><select id="a" style="width:100%;padding:12px">${Q.map((q,i)=>`<option value="${i}" ${i===6?'selected':''}>${i+1}. ${esc(q)}</option>`).join('')}</select></div><div><label>Второй вопрос</label><select id="b" style="width:100%;padding:12px">${Q.map((q,i)=>`<option value="${i}" ${i===7?'selected':''}>${i+1}. ${esc(q)}</option>`).join('')}</select></div></div><div class="actions"><button class="secondary" onclick="compare()">Показать рядом</button></div><div id="comparison"></div></section>`;compare()}
function compare(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value;document.getElementById('comparison').innerHTML=[a,b].map(i=>`<div class="item"><b>${i+1}. ${esc(Q[i])}</b><div class="answer">${esc(state.answers[i])||'Ответ не предоставлен'}</div></div>`).join('')}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(){download('otvety_klienta.json',JSON.stringify({version:1,name:state.name,submitted:state.submitted,questions:Q,answers:state.answers},null,2),'application/json')}function exportText(){download('kartochka_klienta.txt','Карточка клиента\nИмя: '+state.name+'\nСтатус: '+(state.submitted?'Завершена':'Черновик')+'\n\n'+Q.map((q,i)=>(i+1)+'. '+q+'\n'+(state.answers[i]||'Нет ответа')).join('\n\n'),'text/plain;charset=utf-8')}async function importData(el){try{let obj=JSON.parse(await el.files[0].text());if(!Array.isArray(obj.answers)||obj.answers.length!==10||!obj.answers.every(x=>typeof x==='string'))throw Error('Неверный формат');if(!confirm('Заменить текущие ответы данными из файла?'))return;state={answers:obj.answers,name:String(obj.name||''),submitted:!!obj.submitted};save();render()}catch(e){alert('Не удалось загрузить файл: '+e.message)}}document.getElementById('clientTab').onclick=()=>{view='client';render()};document.getElementById('coachTab').onclick=()=>{view='coach';render()};render();
</script></body></html>
